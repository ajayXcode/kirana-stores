<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UdhaarBuddy – Login / Register</title>
  <meta name="description" content="Login or create your UdhaarBuddy grocery shop account.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700;800&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0B0F19;
      --bg-card: #141B2D;
      --bg-input: #1C253B;
      --border: #28354F;
      --border-focus: #3B82F6;
      --text: #F1F5F9;
      --muted: #94A3B8;
      --primary: #3B82F6;
      --primary-hover: #2563EB;
      --success: #10B981;
      --danger: #EF4444;
      --radius: 10px;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      font-family: 'Geist', 'Noto Sans Devanagari', sans-serif;
      color: var(--text);
      overflow: hidden;
    }

    /* Animated background blobs */
    .bg-blobs {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }
    .blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.15;
      animation: float 8s ease-in-out infinite;
    }
    .blob-1 { width: 500px; height: 500px; background: #3B82F6; top: -150px; left: -100px; animation-delay: 0s; }
    .blob-2 { width: 400px; height: 400px; background: #8B5CF6; bottom: -100px; right: -50px; animation-delay: 3s; }
    .blob-3 { width: 300px; height: 300px; background: #10B981; top: 50%; left: 60%; animation-delay: 5s; }
    @keyframes float {
      0%, 100% { transform: translateY(0px) scale(1); }
      50% { transform: translateY(-30px) scale(1.05); }
    }

    .page-wrap {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    .auth-card {
      width: 100%;
      max-width: 420px;
      background: rgba(20, 27, 45, 0.85);
      backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: 0 25px 60px rgba(0,0,0,0.5), 0 0 0 1px rgba(59,130,246,0.08);
      overflow: hidden;
    }

    /* Brand header */
    .auth-brand {
      padding: 2rem 2rem 1.5rem;
      text-align: center;
      border-bottom: 1px solid var(--border);
      background: linear-gradient(160deg, rgba(59,130,246,0.08) 0%, transparent 60%);
    }
    .brand-icon {
      width: 52px; height: 52px;
      background: linear-gradient(135deg, #3B82F6 0%, #8B5CF6 100%);
      border-radius: 14px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 0.75rem;
      box-shadow: 0 8px 24px rgba(59,130,246,0.35);
    }
    .brand-name {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      background: linear-gradient(135deg, #F1F5F9 0%, #94A3B8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .brand-tagline {
      font-size: 0.78rem;
      color: var(--muted);
      margin-top: 0.3rem;
    }

    /* Tab switcher */
    .tab-bar {
      display: flex;
      padding: 1rem 2rem 0;
      gap: 0.5rem;
      border-bottom: 1px solid var(--border);
    }
    .tab-btn {
      flex: 1;
      padding: 0.6rem 0;
      font-size: 0.88rem;
      font-weight: 500;
      font-family: inherit;
      color: var(--muted);
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      cursor: pointer;
      transition: all 0.2s;
      letter-spacing: 0.01em;
    }
    .tab-btn.active {
      color: var(--text);
      border-bottom-color: var(--primary);
    }
    .tab-btn:hover:not(.active) { color: var(--text); }

    /* Form panels */
    .form-panel { display: none; padding: 1.75rem 2rem 2rem; }
    .form-panel.active { display: block; }

    .form-group { margin-bottom: 1rem; }
    .form-label {
      display: block;
      font-size: 0.78rem;
      font-weight: 500;
      color: var(--muted);
      margin-bottom: 0.4rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .form-input {
      width: 100%;
      padding: 0.65rem 0.9rem;
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 0.92rem;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .form-input:focus {
      border-color: var(--border-focus);
      box-shadow: 0 0 0 3px rgba(59,130,246,0.15);
    }
    .form-input::placeholder { color: var(--muted); }

    .input-hint {
      font-size: 0.72rem;
      color: var(--muted);
      margin-top: 0.3rem;
    }

    /* Submit button */
    .btn-submit {
      width: 100%;
      padding: 0.75rem;
      background: linear-gradient(135deg, #3B82F6 0%, #2563EB 100%);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 0.92rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.2s;
      margin-top: 0.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      box-shadow: 0 4px 14px rgba(59,130,246,0.3);
    }
    .btn-submit:hover { background: linear-gradient(135deg, #2563EB 0%, #1D4ED8 100%); transform: translateY(-1px); box-shadow: 0 6px 20px rgba(59,130,246,0.4); }
    .btn-submit:active { transform: translateY(0); }
    .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
    .btn-submit.loading::after {
      content: '';
      width: 14px; height: 14px;
      border: 2px solid rgba(255,255,255,0.4);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Alert box */
    .alert {
      display: none;
      padding: 0.75rem 1rem;
      border-radius: 8px;
      font-size: 0.82rem;
      margin-bottom: 1rem;
      border: 1px solid;
    }
    .alert.show { display: flex; align-items: center; gap: 0.5rem; }
    .alert-error { background: rgba(239,68,68,0.1); border-color: rgba(239,68,68,0.3); color: #F87171; }
    .alert-success { background: rgba(16,185,129,0.1); border-color: rgba(16,185,129,0.3); color: #34D399; }

    /* Demo credentials info */
    .demo-note {
      margin-top: 1.25rem;
      padding: 0.75rem 1rem;
      background: rgba(59,130,246,0.07);
      border: 1px solid rgba(59,130,246,0.2);
      border-radius: 8px;
      font-size: 0.75rem;
      color: var(--muted);
    }
    .demo-note strong { color: #93C5FD; }

    /* Footer */
    .auth-footer {
      padding: 1rem 2rem;
      border-top: 1px solid var(--border);
      text-align: center;
      font-size: 0.72rem;
      color: var(--muted);
    }
    .auth-footer span { color: #3B82F6; }

    /* Divider */
    .divider {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin: 1rem 0;
      color: var(--muted);
      font-size: 0.72rem;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }
  </style>
</head>
<body>
  <div class="bg-blobs">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
  </div>

  <div class="page-wrap">
    <div class="auth-card">

       <!-- Brand Header -->
      <div class="auth-brand">
        <div class="brand-icon">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/>
            <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
            <line x1="12" x2="12" y1="19" y2="22"/>
          </svg>
        </div>
        <div class="brand-name">UdhaarBuddy</div>
        <div class="brand-tagline">🛒 Your Digital Khata for Grocery Shop</div>
      </div>

      <!-- Tab Bar -->
      <div class="tab-bar">
        <button class="tab-btn active" id="tabLogin" onclick="switchTab('login')">🔑 Login to Shop</button>
        <button class="tab-btn" id="tabRegister" onclick="switchTab('register')">📝 New Shop Registration</button>
      </div>

      <!-- LOGIN FORM -->
      <div class="form-panel active" id="panelLogin">
        <div id="loginAlert" class="alert"></div>

        <div class="form-group">
          <label class="form-label">Phone Number (मोबाइल नंबर)</label>
          <input type="text" id="loginPhone" class="form-input" placeholder="e.g. 9876543210" autocomplete="off">
        </div>

        <div class="form-group">
          <label class="form-label">Password (पासवर्ड)</label>
          <input type="password" id="loginPassword" class="form-input" placeholder="Enter your password" autocomplete="current-password">
        </div>

        <button class="btn-submit" id="btnLogin" onclick="doLogin()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" x2="3" y1="12" y2="12"/></svg>
          Open My Shop Dashboard
        </button>

        <div class="demo-note">
          <strong>🧪 Demo Account:</strong> Phone: <strong>9876543210</strong> • Password: <strong>1234</strong><br>
          (Ramesh Kirana Store — sample data included)
        </div>
      </div>

      <!-- REGISTER FORM -->
      <div class="form-panel" id="panelRegister">
        <div id="registerAlert" class="alert"></div>

        <div class="form-group">
          <label class="form-label">Shop Name (दुकान का नाम) *</label>
          <input type="text" id="regShopName" class="form-input" placeholder="e.g. Ramesh Kirana Store" autocomplete="off">
        </div>

        <div class="form-group">
          <label class="form-label">Your Name (आपका नाम) *</label>
          <input type="text" id="regOwnerName" class="form-input" placeholder="e.g. Ramesh Kumar" autocomplete="off">
        </div>

        <div class="form-group">
          <label class="form-label">Phone Number (मोबाइल नंबर) *</label>
          <input type="text" id="regPhone" class="form-input" placeholder="e.g. 9988776655" autocomplete="off">
          <div class="input-hint">This will be your login phone number</div>
        </div>

        <div class="form-group">
          <label class="form-label">Password (पासवर्ड) *</label>
          <input type="password" id="regPassword" class="form-input" placeholder="Choose a password (min 4 letters)" autocomplete="new-password">
        </div>

        <div class="form-group">
          <label class="form-label">Confirm Password (पासवर्ड दोबारा) *</label>
          <input type="password" id="regConfirmPassword" class="form-input" placeholder="Type password again" autocomplete="new-password">
        </div>

        <button class="btn-submit" id="btnRegister" onclick="doRegister()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" y1="8" x2="19" y2="14"/><line x1="22" y1="11" x2="16" y2="11"/></svg>
          Register My Shop Free
        </button>
      </div>

      <div class="auth-footer">
        Made with ❤️ for Grocery Shop Owners &nbsp;•&nbsp; <span>UdhaarBuddy v1.0</span>
      </div>
    </div>
  </div>

  <script>
    // Tab switcher
    function switchTab(tab) {
      document.getElementById('panelLogin').classList.toggle('active', tab === 'login');
      document.getElementById('panelRegister').classList.toggle('active', tab === 'register');
      document.getElementById('tabLogin').classList.toggle('active', tab === 'login');
      document.getElementById('tabRegister').classList.toggle('active', tab === 'register');
      clearAlerts();
    }

    function clearAlerts() {
      ['loginAlert', 'registerAlert'].forEach(id => {
        const el = document.getElementById(id);
        el.className = 'alert';
        el.textContent = '';
      });
    }

    function showAlert(id, msg, type = 'error') {
      const el = document.getElementById(id);
      el.className = `alert show alert-${type}`;
      el.innerHTML = `${type === 'error' ? '⚠️' : '✅'} ${msg}`;
    }

    function setLoading(btnId, loading) {
      const btn = document.getElementById(btnId);
      btn.disabled = loading;
      btn.classList.toggle('loading', loading);
    }

    async function doLogin() {
      const phone = document.getElementById('loginPhone').value.trim();
      const password = document.getElementById('loginPassword').value;
      clearAlerts();

      if (!phone || !password) {
        showAlert('loginAlert', 'Please enter phone number and password.');
        return;
      }

      setLoading('btnLogin', true);
      try {
        const resp = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ phone, password })
        });
        const data = await resp.json();

        if (data.success) {
          showAlert('loginAlert', `Welcome back, ${data.user.owner_name}! Opening dashboard...`, 'success');
          setTimeout(() => { window.location.href = '/'; }, 800);
        } else {
          showAlert('loginAlert', data.error || 'Wrong phone or password. Please try again.');
        }
      } catch (err) {
        showAlert('loginAlert', 'Cannot connect to server. Is the app running?');
      } finally {
        setLoading('btnLogin', false);
      }
    }

    async function doRegister() {
      const shopName = document.getElementById('regShopName').value.trim();
      const ownerName = document.getElementById('regOwnerName').value.trim();
      const phone = document.getElementById('regPhone').value.trim();
      const password = document.getElementById('regPassword').value;
      const confirmPassword = document.getElementById('regConfirmPassword').value;
      clearAlerts();

      if (!shopName || !ownerName || !phone || !password) {
        showAlert('registerAlert', 'Please fill all required fields (*).');
        return;
      }
      if (password.length < 4) {
        showAlert('registerAlert', 'Password must be at least 4 characters long.');
        return;
      }
      if (password !== confirmPassword) {
        showAlert('registerAlert', 'Passwords do not match. Please type again.');
        return;
      }
      if (!/^\d{10}$/.test(phone)) {
        showAlert('registerAlert', 'Please enter a valid 10-digit phone number.');
        return;
      }

      setLoading('btnRegister', true);
      try {
        const resp = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ shop_name: shopName, owner_name: ownerName, phone, password })
        });
        const data = await resp.json();

        if (data.success) {
          showAlert('registerAlert', `Shop "${shopName}" registered! Opening dashboard...`, 'success');
          setTimeout(() => { window.location.href = '/'; }, 900);
        } else {
          showAlert('registerAlert', data.error || 'Registration failed. Please try again.');
        }
      } catch (err) {
        showAlert('registerAlert', 'Cannot connect to server. Is the app running?');
      } finally {
        setLoading('btnRegister', false);
      }
    }

    // Allow Enter key submit
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        const activePanel = document.querySelector('.form-panel.active').id;
        if (activePanel === 'panelLogin') doLogin();
        else doRegister();
      }
    });
  </script>
</body>
</html>
